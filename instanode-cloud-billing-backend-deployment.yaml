apiVersion: apps/v1
kind: Deployment
metadata:
  name: instanode-cloud-billing-backend
  namespace: instanode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: instanode-cloud-billing-backend
  template:
    metadata:
      labels:
        app: instanode-cloud-billing-backend
    spec:
      containers:
        - name: instanode-cloud-billing-backend-container
          image: swr.la-north-2.myhuaweicloud.com/instanodes-organization/instanode-cloud-billing-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: instanode-cloud-billing-backend-config
          resources:
            requests:
              cpu: '500m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1024Mi'
          # Uncomment these as needed
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 7
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

      imagePullSecrets:
        - name: default-secret
      restartPolicy: Always
